# Configuração do Alembic. Roda sempre com `dir = backend` (ver mise.toml), o que
# faz `script_location` relativo funcionar.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# A URL do banco NÃO fica aqui: vem de DATABASE_URL (mise.toml), lida em
# migrations/env.py. Deixar em branco é intencional.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
