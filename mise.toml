[tools]
python = "3.14"
node   = "24"
uv     = "0.12.9"
pnpm   = "11.25.0"

[env]
# O uv é o dono do venv (D9). O mise apenas ativa se já existir — quem cria é
# `mise run setup`. Na primeira entrada no diretório o mise avisa que não existe;
# é esperado.
_.python.venv = { path = "{{config_root}}/backend/.venv", create = false }

# Faz o uv usar o Python que o mise instalou, em vez de baixar outro.
UV_PYTHON_PREFERENCE = "only-system"

# O dado do usuário mora **fora** do repositório, em `~/pauta`. Duas razões: um
# `git clean -xdf` não apaga o banco de ninguém, e este arquivo é commitado —
# com um caminho absoluto ele carregaria a máquina de quem o escreveu, e com
# `{{config_root}}` o dado voltaria para dentro do repositório.
#
# `get_env` em vez de um literal para que a variável já presente no ambiente
# vença: sem isso o `[env]` do mise sobrescreve o que veio de fora, e não
# haveria como apontar outro lugar sem editar (e sujar) o repositório.
PAUTA_HOME = "{{ get_env(name='PAUTA_HOME', default=env.HOME ~ '/pauta') }}"

# Quatro barras: três do esquema `sqlite+pysqlite://` e uma do caminho
# absoluto. Com três, o SQLAlchemy leria `Users` como host.
DATABASE_URL = "sqlite+pysqlite:///{{env.PAUTA_HOME}}/data/pauta.sqlite"

# Sobrescritível à parte do `PAUTA_HOME` de propósito: é esta pasta que vai
# para o Drive, e o banco não pode ir com ela (RNF1 — SQLite em pasta
# sincronizada corrompe). Apontar `SNAPSHOT_DIR` para a pasta da nuvem é o
# caminho certo; sincronizar o `PAUTA_HOME` inteiro levaria o `data/` junto.
SNAPSHOT_DIR = "{{ get_env(name='SNAPSHOT_DIR', default=env.PAUTA_HOME ~ '/snapshots') }}"

PUBLIC_API_URL = "http://127.0.0.1:8000"

[tasks."setup:dirs"]
description = "Cria a pasta de dados do usuário, fora do repositório"
# O SQLite não cria a pasta do arquivo, então `data/` tem que existir antes da
# primeira migration. A do snapshot o writer cria sozinho (`mkdir -p`); entra
# aqui só para o usuário a ver pronta no fim do `setup`.
run = "mkdir -p $PAUTA_HOME/data $SNAPSHOT_DIR"

[tasks."setup:py"]
dir = "{{config_root}}/backend"
run = "uv sync"

[tasks."setup:web"]
dir = "{{config_root}}/frontend"
run = "pnpm install"

[tasks."setup:db"]
description = "Aplica as migrations"
dir = "{{config_root}}/backend"
depends = ["setup:dirs", "setup:py"]
run = "uv run alembic upgrade head"

[tasks.setup]
description = "Prepara a máquina do zero"
depends = ["setup:db", "setup:web"]

[tasks."dev:api"]
description = "API em :8000"
dir = "{{config_root}}/backend"
# `--factory`: a aplicação vem de create_app(), e não de uma instância de
# módulo. É o que mantém `import main` livre de efeito colateral (ver main.py).
run = "uv run uvicorn --factory app.adapters.inbound.http.main:create_app --reload --port 8000"

[tasks."dev:web"]
description = "Front em :4321"
dir = "{{config_root}}/frontend"
run = "pnpm dev"

[tasks.dev]
description = "Sobe API e front juntos"
depends = ["dev:api", "dev:web"]

[tasks."test:py"]
dir = "{{config_root}}/backend"
run = "uv run pytest"

[tasks."test:web"]
dir = "{{config_root}}/frontend"
run = "pnpm vitest run"

[tasks.test]
description = "pytest + vitest"
depends = ["test:py", "test:web"]

[tasks."lint:py"]
description = "ruff + mypy --strict no domínio e aplicação"
dir = "{{config_root}}/backend"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run mypy --strict app/domain app/application",
]

[tasks."lint:web"]
# O cliente de `lib/api.ts` só é "tipado" se alguém conferir os tipos. O `tsc`
# cobre `.ts` e `.tsx`; os `.astro` ficam de fora — checá-los pediria o
# `@astrojs/check`, que não está no §4.1.
description = "tsc --noEmit no front"
dir = "{{config_root}}/frontend"
run = "pnpm typecheck"

[tasks.lint]
description = "ruff + mypy --strict + tsc"
depends = ["lint:py", "lint:web"]

[tasks.fmt]
dir = "{{config_root}}/backend"
run = "uv run ruff format ."

[tasks.types]
description = "Regenera frontend/src/lib/types.ts do OpenAPI"
dir = "{{config_root}}/frontend"
run = "pnpm openapi-typescript http://127.0.0.1:8000/api/v1/openapi.json -o src/lib/types.ts"

[tasks.snapshot]
description = "Exporta snapshot para a pasta sincronizada"
dir = "{{config_root}}/backend"
run = "uv run python -m app.adapters.inbound.cli snapshot export"
